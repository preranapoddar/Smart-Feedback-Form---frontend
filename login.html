<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login</title>

        <link rel="stylesheet" href="./css/style.css" />

        <style>
            h2 {
                text-align: center;
                margin-bottom: 20px;
                color: #333;
            }

            .container {
                width: 30vw;
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: 600;
                color: #444;
            }

            input {
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ccc;
            }

            .error {
                color: red;
                font-size: 1rem;
                margin-bottom: 10px;
                text-align: center;
                visibility: hidden;
            }

            button {
                width: 100%;
                padding: 12px;
                border: none;
                background: #667eea;
                color: white;
                font-size: 16px;
                border-radius: 6px;
                cursor: pointer;
                transition: 0.3s;
            }

            button:hover {
                background: #5a67d8;
            }

            @media screen and (max-width: 768px) {
                body {
                    padding: 15px;
                }

                .container {
                    width: 100%;

                    min-width: unset;

                    padding: 25px;
                }

                h2 {
                    font-size: 1.6rem;
                }

                input {
                    padding: 12px;

                    font-size: 16px;
                }

                button {
                    padding: 13px;

                    font-size: 15px;
                }

                .error {
                    font-size: 0.9rem;
                }
            }

            /* CHANGED: Small mobile devices */
            @media screen and (max-width: 480px) {
                .container {
                    padding: 20px;

                    border-radius: 10px;
                }

                h2 {
                    font-size: 1.4rem;
                }

                label {
                    font-size: 14px;
                }

                input {
                    font-size: 15px;

                    padding: 11px;
                }

                button {
                    font-size: 14px;

                    padding: 12px;
                }

                .hint {
                    font-size: 12px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h2>Admin Login</h2>

            <div class="error" id="errorMsg">Invalid email or password</div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required />
                    <small id="emailHint" class="hint"></small>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required />
                    <small id="passwordHint" class="hint"></small>
                </div>

                <button type="submit" id="loginBtn" disabled>Login</button>
            </form>
        </div>

        <script src="./js/validator.js"></script>

        <script>
            // const port = "https://smart-feedback-form-backend-production.up.railway.app";
            const port = "http://localhost:8080";

            const form = document.getElementById("loginForm");
            const errorMsg = document.getElementById("errorMsg");

            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");

            const emailHint = document.getElementById("emailHint");
            const passwordHint = document.getElementById("passwordHint");
            const loginBtn = document.getElementById("loginBtn");

            function validateEmail() {
                const email = emailInput.value.trim();

                if (isValidEmail(email)) {
                    emailHint.textContent = "Valid email";
                    emailHint.className = "hint valid";

                    return true;
                }

                emailHint.textContent = "Enter valid email like abc@xyz.com";
                emailHint.className = "hint invalid";

                return false;
            }

            function validatePassword() {
                const password = passwordInput.value;

                if (isValidPassword(password)) {
                    passwordHint.textContent = "Strong password";
                    passwordHint.className = "hint valid";

                    return true;
                }

                passwordHint.textContent =
                    "Min 8 chars, 1 upper, 1 lower, 1 digit, 1 special char";
                passwordHint.className = "hint invalid";

                return false;
            }

            function validateForm() {
                const emailValid = validateEmail();
                const passwordValid = validatePassword();

                loginBtn.disabled = !(emailValid && passwordValid);
            }

            emailInput.addEventListener("input", validateForm);
            passwordInput.addEventListener("input", validateForm);
            // validateForm();

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                disableForm();

                fetch(port + "/user/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email, password }),
                })
                    .then((response) => {
                        if (!response.ok) throw new Error("Login failed.");
                        return response.json();
                    })
                    .then((responseData) => {
                        localStorage.setItem(
                            "auth-token-xyz",
                            responseData.token,
                        );
                        alert("Login successfull!");
                        enableForm();
                        document.getElementById("loginForm").reset();

                        window.location.href = "dashboard.html";
                    })
                    .catch((error) => {
                        errorMsg.style.visibility = "visible";
                        alert("Invalid email or password.");
                        console.error(error);
                        enableForm();
                    });
            });

            function disableForm() {
                const form = document.querySelector("form");

                form.classList.add("disabled");

                form.querySelectorAll(
                    "input, button, select, textarea",
                ).forEach((el) => (el.disabled = true));
            }

            function enableForm() {
                const form = document.querySelector("form");

                form.classList.remove("disabled");

                form.querySelectorAll(
                    "input, button, select, textarea",
                ).forEach((el) => (el.disabled = false));
            }
        </script>
    </body>
</html>
